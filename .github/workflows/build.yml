---
# Builds the project's images, pushes them to Harbor and commits the new tags to
# k8s/<overlay>/values/, which ArgoCD then deploys. See README.md, "ArgoCD deployment".
name: Build & Push Images

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "k8s/**"
      - "**.md"
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read-only default; only update-tags gets contents: write.
permissions:
  contents: read

env:
  # Must match the image repositories in k8s/*/values/, which ArgoCD pulls from.
  REGISTRY: registry.wdr.io

jobs:
  # ---------------------------------------------------------------
  # Validate: the project has no application code, so lint the Dockerfile.
  # ---------------------------------------------------------------
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: silta/nginx.Dockerfile
          failure-threshold: error

  # ---------------------------------------------------------------
  # Build and push the nginx image.
  # ---------------------------------------------------------------
  build-image:
    name: Build & Push — nginx
    runs-on: ubuntu-latest
    needs: validate
    # Images only on push. A pull_request run would build the same commit a second time and
    # race the push run's tag commit, and fork pull requests get no registry secrets; pull
    # requests are validated only. update-tags commits with "[skip ci]", so it never retriggers.
    # No images from the template repository itself (is_template), so it never deploys: a
    # repository created from the template has is_template false and builds normally.
    # Dependency update branches (Dependabot, Renovate) are validated but get no images either:
    # they never deploy, and Dependabot runs without the registry secrets. Skipping this job
    # also skips update-tags, which needs it.
    if: >-
      github.event_name == 'push' &&
      !github.event.repository.is_template &&
      !startsWith(github.head_ref || github.ref_name, 'dependabot/') &&
      !startsWith(github.head_ref || github.ref_name, 'renovate/')
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build & push image
        uses: wunderio/argocd-silta-actions/build-push-image@v1
        with:
          image-name: nginx
          dockerfile: silta/nginx.Dockerfile
          # The site's files; the Dockerfile copies the build context to /app/web.
          build-context: web
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}

  # ---------------------------------------------------------------
  # Update image tags in the ArgoCD values file of the branch's overlay.
  # Queries the registry for the latest tags and commits the update.
  # ---------------------------------------------------------------
  update-tags:
    name: Update Image Tags
    runs-on: ubuntu-latest
    needs: build-image
    permissions:
      contents: write
    steps:
      # The ArgoCD GitHub App token lets the tag commit pass branch protection.
      - name: Generate ArgoCD App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ARGOCD_APP_ID }}
          private-key: ${{ secrets.ARGOCD_APP_PRIVATE_KEY }}

      - name: Update image tags
        uses: wunderio/argocd-silta-actions/update-image-tags@v1
        with:
          image-names: "nginx"
          values-file: values/simple.yaml
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
          token: ${{ steps.app-token.outputs.token }}
          # Also commit the production branch's tags to k8s/production/, so merging to
          # production releases it.
          production: "true"
